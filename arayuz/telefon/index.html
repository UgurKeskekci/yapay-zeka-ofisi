<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ofis Mesajları</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="telefon.css">
  <script src="telefon.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
      <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/></symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24"><path d="m7 3 3 5-3 3c1.4 3 3 4.6 6 6l3-3 5 3c.2 3-1.5 4-4 4C10 21 3 14 3 7c0-2.5 1-4.2 4-4Z"/></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
      <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14.5c2 2 6 2 8 0M8 9h.01M16 9h.01"/></symbol>
      <symbol id="icon-clip" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2M6 15l9-9" transform="translate(2 1) scale(.85)"/></symbol>
      <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M8 22h8"/></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="m3 3 19 9L3 21l3-9-3-9ZM6 12h16"/></symbol>
      <symbol id="icon-checks" viewBox="0 0 24 16"><path d="m1 8 4 4L16 1M10 10l2 2L23 1"/></symbol>
    </defs>
  </svg>

  <span id="sample-label" class="sample-label" hidden>örnek veri</span>
  <main class="stage" aria-label="Temsili telefon mesaj ekranı">
    <section id="phone" class="phone" aria-label="Telefon">
      <div class="screen">
        <div class="status-bar">
          <span id="status-time" class="status-time" aria-label="Son mesajın saati"></span>
          <div class="status-icons" aria-hidden="true">
            <svg viewBox="0 0 20 16" class="signal"><path d="M1 15h3v-4H1Zm5 0h3V8H6Zm5 0h3V5h-3Zm5 0h3V1h-3Z"/></svg>
            <svg viewBox="0 0 20 16" class="wifi"><path d="M1 5a14 14 0 0 1 18 0M4 8a9 9 0 0 1 12 0M7 11a4.5 4.5 0 0 1 6 0"/><circle cx="10" cy="14" r="1"/></svg>
            <svg viewBox="0 0 29 16" class="battery"><rect x="1" y="2" width="23" height="12" rx="3"/><path d="M27 6v4"/><rect class="battery-fill" x="3" y="4" width="18" height="8" rx="1.5"/></svg>
          </div>
        </div>
        <div class="camera-island" aria-hidden="true"><i></i></div>

        <header class="chat-header">
          <span class="back-icon" aria-hidden="true"><svg class="icon"><use href="#icon-back"/></svg></span>
          <div class="avatar" aria-hidden="true">M</div>
          <div class="contact">
            <h1 id="contact-name">Müdür</h1>
            <p id="contact-subtitle"></p>
          </div>
          <div class="header-icons" aria-hidden="true">
            <svg class="icon video-icon"><use href="#icon-video"/></svg>
            <svg class="icon call-icon"><use href="#icon-phone"/></svg>
            <svg class="icon"><use href="#icon-more"/></svg>
          </div>
        </header>

        <div id="messages" class="messages" role="log" aria-label="Mesajlar" aria-live="off" tabindex="0"></div>

        <footer class="composer">
          <div class="input-shell">
            <svg class="icon smile-icon" aria-hidden="true"><use href="#icon-smile"/></svg>
            <div id="compose-text" class="compose-text" aria-label="Mesaj giriş alanı"><span class="placeholder">Mesaj</span></div>
            <svg class="icon attachment-icon" aria-hidden="true"><use href="#icon-clip"/></svg>
            <svg class="icon camera-icon" aria-hidden="true"><use href="#icon-camera"/></svg>
          </div>
          <button id="compose-button" class="compose-button" type="button" aria-label="Mikrofon" tabindex="-1">
            <svg class="icon" aria-hidden="true"><use id="compose-icon" href="#icon-mic"/></svg>
          </button>
        </footer>
        <div class="home-area" aria-hidden="true"><div class="home-indicator"></div></div>
      </div>
    </section>
  </main>
</body>
</html>
